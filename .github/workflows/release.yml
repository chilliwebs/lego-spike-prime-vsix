name: Release VSIX

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Package VSIX
        run: npx vsce package --allow-missing-repository --no-rewrite-relative-links

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: lego-spike-prime-*.vsix